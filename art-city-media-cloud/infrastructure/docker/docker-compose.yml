services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artcity
      POSTGRES_PASSWORD: artcity
      POSTGRES_DB: artcity
    ports:
      - "5432:5432"
    volumes:
      - artcity_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artcity -d artcity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: artcity
      MINIO_ROOT_PASSWORD: artcitysecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - artcity_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 artcity artcitysecret;
      mc mb -p local/artcity-media || true;
      exit 0;
      "

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://artcity:artcity@postgres:5432/artcity
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../../services/api
      dockerfile: Dockerfile.worker
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+psycopg://artcity:artcity@postgres:5432/artcity
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_started

  web:
    build:
      context: ../../apps/archive-web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  artcity_pg:
  artcity_minio:
